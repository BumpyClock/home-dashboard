[package]
name = "frame-host-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
calendar-sync = { path = "calendar-sync", features = ["host"] }
host-state = { path = "host-state" }
host-command = { path = "host-command" }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3"
