[package]
name = "calendar-sync"
version = "0.1.0"
edition = "2021"

[features]
host = ["dep:host-command", "dep:chrono-tz"]

[dependencies]
host-command = { path = "../host-command", optional = true }
chrono-tz = { version = "0.10", features = ["serde"], optional = true }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
