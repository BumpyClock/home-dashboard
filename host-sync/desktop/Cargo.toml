[package]
name = "frame-host-sync-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
frame-host-sync = { path = ".." }
calendar-sync = { path = "../calendar-sync", features = ["host"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
